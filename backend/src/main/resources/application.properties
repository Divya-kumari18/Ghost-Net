# See http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
spring.config.import=optional:file:../.env[.properties]

# Core server + datasource (maps from root .env uppercase keys)
server.port=${SERVER_PORT:8081}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ghostnet}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}

# JWT config (maps from root .env uppercase keys)
ghostnet.jwt.secret=${GHOSTNET_JWT_SECRET}
ghostnet.jwt.expiration=${GHOSTNET_JWT_EXPIRATION:3600000}
ghostnet.jwt.refresh-expiration=${GHOSTNET_JWT_REFRESH_EXPIRATION:604800000}
ghostnet.cors.allowed-origins=${GHOSTNET_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

spring.thymeleaf.cache=false
spring.main.show-banner=false
logging.level.jdbc=OFF
logging.level.jdbc.sqltiming=DEBUG
logging.level.jdbc.resultsettable=DEBUG
logging.level.org.apache.coyote.http11.Http11Processor=ERROR
logging.level.org.apache.tomcat.util.net.NioEndpoint=ERROR

# Python threat-intel microservices (secure defaults: disabled)
python.malware.enabled=false
python.malware.base-url=http://127.0.0.1:${ML_APP_PORT:5000}
python.malware.high-confidence-threshold=85.0

python.yara.enabled=${GHOSTNET_YARA_ENABLED:false}
python.yara.base-url=http://127.0.0.1:${ML_APP_PORT:5000}
python.yara.rules-dir=

# HTTP client timeouts for Python microservice calls
python.request.connect-timeout-ms=1500
python.request.read-timeout-ms=2500

# Upload limits for malware scan API
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Windows event catalog (eventdetails.md)
ghostnet.events.details-path=src/main/java/com/ghostnet/windows/eventdetails.md

# Honeypot Docker integration
ghostnet.honeypot.docker.enabled=false
ghostnet.honeypot.docker.binary=docker
ghostnet.honeypot.docker.network=
ghostnet.honeypot.docker.command-timeout-seconds=30
ghostnet.honeypot.images.cowrie=cowrie/cowrie:latest
ghostnet.honeypot.images.dionaea=dtagdevsec/dionaea:latest
ghostnet.honeypot.images.conpot=mushorg/conpot:latest

# Cowrie log ingestion (tail the JSON log file Cowrie writes to var/log/cowrie/cowrie.json)
ghostnet.honeypot.cowrie.enabled=false
ghostnet.honeypot.cowrie.log-path=
ghostnet.honeypot.cowrie.honeypot-name=Cowrie Docker
ghostnet.honeypot.cowrie.honeypot-type=ssh
ghostnet.honeypot.cowrie.host-ip=127.0.0.1
ghostnet.honeypot.cowrie.host-port=2222
ghostnet.honeypot.cowrie.poll-interval-ms=4000
ghostnet.honeypot.cowrie.tail-from-end=true

# OWASP ZAP web scanning
ghostnet.zap.enabled=${GHOSTNET_ZAP_ENABLED:false}
ghostnet.zap.base-url=${GHOSTNET_ZAP_BASE_URL:http://127.0.0.1:8090}
ghostnet.zap.api-key=${GHOSTNET_ZAP_API_KEY:}
ghostnet.zap.poll-interval-ms=2000
ghostnet.zap.scan-timeout-seconds=900
ghostnet.virustotal.enabled=${GHOSTNET_VIRUSTOTAL_ENABLED:false}
ghostnet.virustotal.api-key=${GHOSTNET_VIRUSTOTAL_API_KEY:}
ghostnet.virustotal.base-url=${GHOSTNET_VIRUSTOTAL_BASE_URL:https://www.virustotal.com/api/v3}
ghostnet.vulnerability.nmap-path=${GHOSTNET_NMAP_PATH:C:/Program Files (x86)/Nmap/nmap.exe}
ghostnet.integrations.encryption-key=${GHOSTNET_INTEGRATION_ENCRYPTION_KEY:${ghostnet.jwt.secret}}
ghostnet.bootstrap.enabled=${GHOSTNET_BOOTSTRAP_ENABLED:false}
ghostnet.bootstrap.password=${GHOSTNET_BOOTSTRAP_PASSWORD:}

python.api-key=${GHOSTNET_ML_API_KEY:}
python.anomaly.enabled=${GHOSTNET_ANOMALY_ENABLED:false}
ghostnet.kafka.enabled=${GHOSTNET_KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=3000
ghostnet.fim.roots=${GHOSTNET_FIM_ROOTS:}
ghostnet.storage.uploads=${GHOSTNET_UPLOADS:../uploads}
